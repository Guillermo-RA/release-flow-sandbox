# Despliegue por release — Laravel + Inertia en Docker (plantilla por defecto de 10code).
#
# Sigue las convenciones de 10code-inertia-template / snp-community:
#   - docker/<entorno>/php/Dockerfile: multi-stage, incluye el `npm run build` de Vite.
#   - docker/<entorno>/nginx/Dockerfile: copia public/ de la imagen PHP de la misma
#     versión (ARG SHA + REPOSITORY + APP_ENV), así que va SIEMPRE después de la PHP.
#   - php, horizon, cron, reverb y ssr usan la misma imagen PHP: un rollback cambia
#     backend, frontend y workers a la vez.
# Diferencia: las imágenes se etiquetan con la versión (…-production-php:v1.4.0)
# en vez de con el SHA. Un rollback reutiliza la imagen ya publicada; si ya no
# existe (limpieza del registry), se reconstruye desde el tag.
#
#   - Pre-release publicada (v1.4.0-rc.1)  -> staging
#   - Release publicada     (v1.4.0)       -> production
#   - Run workflow manual (version + env)  -> redespliegue / ROLLBACK
#
# MIPROYECTO es el grupo/label de runners del proyecto (lo rellena scripts/inicializar-proyecto.sh).
# Variables por GitHub Environment (staging / production):
#   DOCKER_BUILD_ARGS  build-args extra de la imagen PHP, uno por línea; aquí van
#                      los VITE_* públicos (VITE_REVERB_HOST=…, VITE_REVERB_PORT=…)
#   Despliegue con docker compose (como snp-community):
#     ENV_FILE_PATH    ruta en el servidor del .env que lee el compose (obligatoria)
#     MIGRATE_COMMAND  p. ej. "php artisan migrate --force" (vacío = no migra)
#   Despliegue con Ansible (como 10code-inertia-template):
#     ANSIBLE_PATH, USER  igual que en reusable-cd.yml; el playbook recibe
#                         -e app_version=<versión> y se ocupa de las migraciones
# Secretos: GHCR_TOKEN, VITE_REVERB_APP_KEY (si se usa Reverb)
name: Deploy
run-name: "Deploy ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }} → ${{ github.event_name == 'release' && (github.event.release.prerelease && 'staging' || 'production') || inputs.environment }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag a desplegar (ej. v1.3.2). Para hacer rollback, indica una versión anterior."
        required: true
        type: string
      environment:
        description: "Entorno"
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event_name == 'release' && (github.event.release.prerelease && 'staging' || 'production') || inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolver versión y entorno
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Checkout (historial y tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar versión y entorno
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          SKIP_RC_CHECK: ${{ vars.SKIP_RC_CHECK }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            VERSION="$RELEASE_TAG"
            if [ "$PRERELEASE" = "true" ]; then ENVIRONMENT=staging; else ENVIRONMENT=production; fi
          else
            VERSION="$INPUT_VERSION"
            ENVIRONMENT="$INPUT_ENVIRONMENT"
          fi

          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' no es una versión válida (vX.Y.Z o vX.Y.Z-rc.N)"; exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::El tag $VERSION no existe"; exit 1
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            if [[ "$VERSION" == *-rc.* ]]; then
              echo "::error::Una release candidate ($VERSION) no puede ir a producción"; exit 1
            fi
            # Una release final nueva debe ser exactamente el commit de un rc ya validado en staging.
            # No aplica a los redespliegues manuales (rollback a versiones ya publicadas).
            if [ "$EVENT" = "release" ] && [ "$SKIP_RC_CHECK" != "true" ]; then
              COMMIT=$(git rev-list -n 1 "$VERSION")
              if ! git tag --points-at "$COMMIT" | grep -qxE "${VERSION//./\\.}-rc\.[0-9]+"; then
                echo "::error::Ningún ${VERSION}-rc.N apunta al commit de $VERSION. Publica y valida un rc en staging primero."; exit 1
              fi
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "### Despliegue de $VERSION en $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Desplegar ${{ needs.resolve.outputs.version }} en ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on:
      group: ${{ needs.resolve.outputs.environment == 'production' && 'MIPROYECTO-production' || 'MIPROYECTO-staging' }}
      labels: [MIPROYECTO]
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      APP_ENV_NAME: ${{ needs.resolve.outputs.environment }}
      COMPOSE_FILE: docker-compose-${{ needs.resolve.outputs.environment }}.yml
    steps:
      # El compose y los Dockerfiles salen del propio tag: un rollback usa la
      # infraestructura de esa versión, no la actual.
      - name: Checkout del tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: ¿Existen ya las imágenes de esta versión?
        id: existing
        run: |
          IMAGE_REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PREFIX="ghcr.io/$IMAGE_REPOSITORY"
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> "$GITHUB_ENV"
          if docker manifest inspect "$IMAGE_PREFIX-$APP_ENV_NAME-php:$VERSION" >/dev/null 2>&1 \
            && docker manifest inspect "$IMAGE_PREFIX-$APP_ENV_NAME-nginx:$VERSION" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Las imágenes de $VERSION ya existen en GHCR: se reutilizan sin recompilar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- Construcción (solo si las imágenes no existen) ----------

      - name: Build & push imagen PHP
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ env.APP_ENV_NAME }}/php/Dockerfile
          push: true
          # VITE_* se incrustan en el bundle durante el build: por eso hay una imagen
          # por entorno. VITE_APP_VERSION permite mostrar la versión en el frontend.
          build-args: |
            APP_ENV=${{ env.APP_ENV_NAME }}
            APP_VERSION=${{ env.VERSION }}
            VITE_APP_VERSION=${{ env.VERSION }}
            ${{ vars.DOCKER_BUILD_ARGS }}
          secrets: |
            vite_reverb_app_key=${{ secrets.VITE_REVERB_APP_KEY }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ env.APP_ENV_NAME }}-php:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}

      # El Dockerfile de nginx parte de ${REGISTRY}/${REPOSITORY}-${APP_ENV}-php:${SHA}:
      # SHA recibe la versión para copiar los assets de Vite de esta misma release.
      - name: Build & push imagen Nginx
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ env.APP_ENV_NAME }}/nginx/Dockerfile
          push: true
          build-args: |
            APP_ENV=${{ env.APP_ENV_NAME }}
            APP_VERSION=${{ env.VERSION }}
            SHA=${{ env.VERSION }}
            REPOSITORY=${{ env.IMAGE_REPOSITORY }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ env.APP_ENV_NAME }}-nginx:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}

      # ---------- Activación (siempre: despliegue nuevo y rollback) ----------

      - name: Versión anterior
        run: |
          HISTORY="$HOME/.deploy-history/${{ github.event.repository.name }}-$APP_ENV_NAME.log"
          mkdir -p "$(dirname "$HISTORY")"
          echo "HISTORY=$HISTORY" >> "$GITHUB_ENV"
          echo "PREVIOUS=$(tail -n 1 "$HISTORY" 2>/dev/null | awk '{print $NF}')" >> "$GITHUB_ENV"

      # --- Opción A: docker compose (snp-community) ---
      # El compose debe usar la etiqueta en todas las imágenes de la app:
      #   image: ${IMAGE_PREFIX}-<entorno>-php:${APP_VERSION}   (o :${SHA}, ambas valen)
      # en php, horizon, cron, reverb y ssr, para que todos cambien juntos.
      - name: Preparar .env y descargar imágenes
        if: vars.ANSIBLE_PATH == ''
        env:
          ENV_FILE_PATH: ${{ vars.ENV_FILE_PATH }}
        run: |
          test -n "$ENV_FILE_PATH" || { echo "::error::Falta la variable ENV_FILE_PATH en el environment $APP_ENV_NAME"; exit 1; }
          cp "$ENV_FILE_PATH" .env
          echo "APP_VERSION=$VERSION" >> .env
          echo "SHA=$VERSION" >> .env
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> .env
          docker compose -f "$COMPOSE_FILE" pull

      # Antes de recrear los contenedores: el esquema nuevo tiene que funcionar con
      # el código que todavía está sirviendo (expand/contract).
      - name: Migraciones
        if: vars.ANSIBLE_PATH == '' && vars.MIGRATE_COMMAND != ''
        run: docker compose -f "$COMPOSE_FILE" run --rm --no-deps php ${{ vars.MIGRATE_COMMAND }}

      - name: Levantar contenedores
        if: vars.ANSIBLE_PATH == ''
        run: |
          docker compose -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans
          docker image prune -f

      # --- Opción B: Ansible (10code-inertia-template) ---
      - name: Desplegar con Ansible
        if: vars.ANSIBLE_PATH != ''
        run: |
          cd "/home/debian/${{ vars.USER }}/actions-runner/_work/${{ vars.ANSIBLE_PATH }}/${{ vars.ANSIBLE_PATH }}"
          ansible-playbook site.yml -i "inventory/$APP_ENV_NAME.yml" --vault-password-file .vault_pass -e "app_version=$VERSION"

      - name: Registrar despliegue
        run: |
          echo "$(date -u +%FT%TZ) ${{ github.actor }} ${{ github.event_name }} $VERSION" >> "$HISTORY"
          echo "Desplegado: ${PREVIOUS:-ninguna} → **$VERSION**" >> "$GITHUB_STEP_SUMMARY"

  jira:
    name: Marcar hito como publicado en Jira
    needs: [resolve, deploy]
    if: github.event_name == 'release' && needs.resolve.outputs.environment == 'production'
    uses: ./.github/workflows/jira-release.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
